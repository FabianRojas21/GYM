<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d9ff43">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Sobrecarga</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#view">Ir al contenido principal</a>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="30" height="22" viewBox="0 0 30 22" aria-hidden="true">
        <rect x="0" y="9" width="30" height="4" fill="currentColor"/>
        <rect x="3" y="2" width="4" height="18" rx="1" fill="var(--accent)"/>
        <rect x="8" y="5" width="3" height="12" rx="1" fill="var(--accent)"/>
        <rect x="23" y="2" width="4" height="18" rx="1" fill="var(--accent)"/>
        <rect x="19" y="5" width="3" height="12" rx="1" fill="var(--accent)"/>
      </svg>
      Sobrecarga
    </div>
    <div class="today" id="today"></div>
  </header>
  <main id="view" tabindex="-1" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="Secciones"><div class="in">
  <button class="tab" role="tab" aria-controls="view" data-act="tab" data-tab="hoy">Hoy</button>
  <button class="tab" role="tab" aria-controls="view" data-act="tab" data-tab="rutinas">Biblioteca</button>
  <button class="tab" role="tab" aria-controls="view" data-act="tab" data-tab="historial">Historial</button>
  <button class="tab" role="tab" aria-controls="view" data-act="tab" data-tab="yo">Yo</button>
  <button class="tab" role="tab" aria-controls="view" data-act="tab" data-tab="ajustes">Ajustes</button>
</div></nav>
<div class="toast" id="toast" role="status" hidden></div>

<script src="engine.js"></script>
<script src="app.js"></script>
<div id="pwa-update" hidden><button type="button" id="pwa-update-button">Instalar nueva versión</button></div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').then(function(registration){
      if (registration.waiting) document.getElementById('pwa-update').hidden=false;
      registration.addEventListener('updatefound', function(){
        var worker=registration.installing;
        worker.addEventListener('statechange', function(){ if(worker.state==='installed' && navigator.serviceWorker.controller) document.getElementById('pwa-update').hidden=false; });
      });
    }).catch(function(){ /* El modo offline es opcional. */ });
  });
}
document.getElementById('pwa-update-button').addEventListener('click', function(){
  navigator.serviceWorker.getRegistration().then(function(registration){ if(registration&&registration.waiting) registration.waiting.postMessage({type:'SKIP_WAITING'}); });
});
navigator.serviceWorker && navigator.serviceWorker.addEventListener && navigator.serviceWorker.addEventListener('controllerchange', function(){ window.location.reload(); });
</script>
</body>
</html>
