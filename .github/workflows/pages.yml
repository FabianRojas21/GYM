name: Deploy Sobrecarga

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run automated tests
        run: node --test engine.test.js

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version deployed assets
        env:
          BUILD_ID: ${{ github.sha }}
        run: |
          echo "Versioning deployed assets with $BUILD_ID"
          sed -i "s/__BUILD_ID__/${BUILD_ID}/g" index.html sw.js
      - name: Verify deployed asset versions
        env:
          BUILD_ID: ${{ github.sha }}
        run: |
          if grep -q '__BUILD_ID__' index.html sw.js; then
            echo "Asset build IDs were not replaced"
            exit 1
          fi
          grep -Fq "app.js?v=${BUILD_ID}" index.html
          grep -Fq "sobrecarga-${BUILD_ID}" sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
